<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Air Drawer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --glow: #2fe6c0;
      --glow-rgb: 47, 230, 192;
      --erase: #ffd166;
      --pause: #ff6b6b;
      --move: #7dd3fc;
      --panel: rgba(6, 12, 16, 0.82);
      --line: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      color: #eefcf7;
      font-family: 'Space Grotesk', sans-serif;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(47, 230, 192, 0.2), transparent 55%),
        linear-gradient(165deg, #061018 0%, #0a1520 50%, #04080c 100%);
      overflow: hidden;
    }

    .shell {
      width: min(1120px, 100vw);
      height: 100vh;
      margin: 0 auto;
      padding: 12px 12px 16px;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: clamp(1.4rem, 3vw, 1.9rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--glow);
      text-shadow: 0 0 22px rgba(var(--glow-rgb), 0.4);
    }

    .hint { color: rgba(238, 252, 247, 0.75); font-size: 0.9rem; }

    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 420px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(var(--glow-rgb), 0.35);
      box-shadow: 0 18px 48px rgba(0, 0, 0, 0.5);
      background: #000;
    }

    #webcam,
    #drawCanvas,
    #uiCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #webcam {
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
      opacity: 0.72;
      transition: opacity 0.2s ease;
    }

    #drawCanvas { z-index: 2; }
    #uiCanvas { z-index: 3; pointer-events: none; }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 6;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      font-size: 0.84rem;
      font-weight: 600;
      max-width: min(420px, calc(100% - 140px));
    }

    .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #888;
      flex-shrink: 0;
      box-shadow: 0 0 10px currentColor;
    }

    #modeBadge {
      position: absolute;
      top: 12px;
      right: 12px;
      z-index: 6;
      padding: 10px 14px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--line);
      font-size: 0.84rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    #controls {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      max-width: calc(100% - 16px);
    }

    .group { display: flex; align-items: center; gap: 6px; }

    .swatches { display: flex; gap: 6px; }
    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.35);
      cursor: pointer;
      padding: 0;
      background: var(--c);
    }
    .swatch.active { box-shadow: 0 0 0 2px #fff; }

    label {
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(238, 252, 247, 0.55);
      font-weight: 600;
    }

    input[type="color"] {
      width: 30px;
      height: 30px;
      border: none;
      background: none;
      border-radius: 50%;
      padding: 0;
      cursor: pointer;
    }

    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch {
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
    }

    input[type="range"] {
      width: 90px;
      accent-color: var(--glow);
      cursor: pointer;
    }

    button {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.08);
      color: #eefcf7;
      border-radius: 999px;
      padding: 7px 12px;
      font: 700 0.8rem 'Space Grotesk', sans-serif;
      cursor: pointer;
      white-space: nowrap;
    }

    button:hover { background: rgba(255, 255, 255, 0.16); }
    button.danger {
      border-color: rgba(255, 107, 107, 0.45);
      background: rgba(255, 107, 107, 0.15);
      color: #ff9a9a;
    }
    button.danger:hover { background: #ff6b6b; color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    footer {
      text-align: center;
      font-size: 0.82rem;
      color: rgba(238, 252, 247, 0.7);
      line-height: 1.65;
    }

    footer b.draw { color: var(--glow); }
    footer b.erase { color: var(--erase); }
    footer b.pause { color: var(--pause); }
    footer b.move { color: var(--move); }

    #gate {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.72);
      text-align: center;
      padding: 24px;
    }

    #gate.hidden { display: none; }

    #gate p {
      max-width: 460px;
      margin: 0 auto 16px;
      color: rgba(238, 252, 247, 0.85);
      line-height: 1.5;
    }

    #startBtn {
      border-color: rgba(var(--glow-rgb), 0.55);
      background: rgba(var(--glow-rgb), 0.2);
      color: var(--glow);
      font-size: 1rem;
      padding: 12px 26px;
    }

    #startBtn:hover { background: var(--glow); color: #041016; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>Air Drawer</h1>
      <p class="hint">Draw, erase, move your art with hand gestures — skeleton = tracking OK.</p>
    </header>

    <div id="stage">
      <video id="webcam" autoplay playsinline muted></video>
      <canvas id="drawCanvas"></canvas>
      <canvas id="uiCanvas"></canvas>

      <div id="status">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Loading hand tracker...</span>
      </div>
      <div id="modeBadge">MODE: —</div>

      <div id="controls">
        <div class="group swatches" id="swatches"></div>
        <div class="group">
          <label for="colorPicker">Color</label>
          <input type="color" id="colorPicker" value="#2fe6c0" />
        </div>
        <div class="group">
          <label for="brushSize">Size</label>
          <input type="range" id="brushSize" min="3" max="40" value="12" />
        </div>
        <div class="group">
          <label for="camDim">Cam</label>
          <input type="range" id="camDim" min="20" max="100" value="72" />
        </div>
        <button id="undoBtn" type="button" title="Ctrl+Z">Undo</button>
        <button id="redoBtn" type="button" title="Ctrl+Y">Redo</button>
        <button id="saveBtn" type="button">Save</button>
        <button id="clearBtn" class="danger" type="button">Clear</button>
      </div>

      <div id="gate">
        <div>
          <p id="gateMsg">Loading Air Drawer… First load may take a few seconds.</p>
          <button id="startBtn" type="button">Open Camera &amp; Start</button>
        </div>
      </div>
    </div>

    <footer>
      <b class="draw">☝️ Index</b> Draw &nbsp;|&nbsp;
      <b class="move">✌️ Peace (2 fingers)</b> Move art &nbsp;|&nbsp;
      <b class="erase">🖐️ Palm</b> Erase &nbsp;|&nbsp;
      <b class="pause">✊ Fist</b> Pause
    </footer>
  </div>

  <script type="module">
    import {
      FilesetResolver,
      HandLandmarker
    } from 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm';

    const video = document.getElementById('webcam');
    const drawCanvas = document.getElementById('drawCanvas');
    const uiCanvas = document.getElementById('uiCanvas');
    const drawCtx = drawCanvas.getContext('2d');
    const uiCtx = uiCanvas.getContext('2d');

    const colorPicker = document.getElementById('colorPicker');
    const brushSize = document.getElementById('brushSize');
    const camDim = document.getElementById('camDim');
    const clearBtn = document.getElementById('clearBtn');
    const undoBtn = document.getElementById('undoBtn');
    const redoBtn = document.getElementById('redoBtn');
    const saveBtn = document.getElementById('saveBtn');
    const statusText = document.getElementById('statusText');
    const statusDot = document.getElementById('statusDot');
    const modeBadge = document.getElementById('modeBadge');
    const gate = document.getElementById('gate');
    const gateMsg = document.getElementById('gateMsg');
    const startBtn = document.getElementById('startBtn');
    const swatchesEl = document.getElementById('swatches');

    const PRESET_COLORS = ['#2fe6c0', '#ffffff', '#ff6b6b', '#ffd166', '#7dd3fc', '#c084fc'];

    const HAND_CONNECTIONS = [
      [0, 1], [1, 2], [2, 3], [3, 4],
      [0, 5], [5, 6], [6, 7], [7, 8],
      [0, 9], [9, 10], [10, 11], [11, 12],
      [0, 13], [13, 14], [14, 15], [15, 16],
      [0, 17], [17, 18], [18, 19], [19, 20],
      [5, 9], [9, 13], [13, 17]
    ];

    // Offscreen ink layer — drawing lives here so we can move/undo it
    const ink = document.createElement('canvas');
    const inkCtx = ink.getContext('2d');

    let handLandmarker = null;
    let lastVideoTime = -1;
    let lastX = null;
    let lastY = null;
    let smoothX = null;
    let smoothY = null;
    let moveLastX = null;
    let moveLastY = null;
    let running = false;
    let stableMode = 'pause';
    let pendingMode = 'pause';
    let pendingCount = 0;
    let strokeActive = false;

    const undoStack = [];
    const redoStack = [];
    const MAX_HISTORY = 25;

    const SMOOTH = 0.58;
    const ERASER = 34;
    const MODE_STABLE_FRAMES = 3;

    function setStatus(text, color) {
      statusText.textContent = text;
      statusDot.style.background = color;
      statusDot.style.color = color;
    }

    function setMode(label, color) {
      modeBadge.textContent = `MODE: ${label}`;
      modeBadge.style.color = color;
    }

    function updateHistoryButtons() {
      undoBtn.disabled = undoStack.length === 0;
      redoBtn.disabled = redoStack.length === 0;
    }

    function pushHistory() {
      try {
        undoStack.push(inkCtx.getImageData(0, 0, ink.width, ink.height));
        if (undoStack.length > MAX_HISTORY) undoStack.shift();
        redoStack.length = 0;
        updateHistoryButtons();
      } catch (err) {
        console.warn('History snapshot failed', err);
      }
    }

    function restoreImageData(data) {
      inkCtx.putImageData(data, 0, 0);
      presentInk();
    }

    function undo() {
      if (!undoStack.length) return;
      try {
        redoStack.push(inkCtx.getImageData(0, 0, ink.width, ink.height));
        restoreImageData(undoStack.pop());
        updateHistoryButtons();
        setStatus('Undo', '#c084fc');
      } catch (err) {
        console.warn(err);
      }
    }

    function redo() {
      if (!redoStack.length) return;
      try {
        undoStack.push(inkCtx.getImageData(0, 0, ink.width, ink.height));
        restoreImageData(redoStack.pop());
        updateHistoryButtons();
        setStatus('Redo', '#c084fc');
      } catch (err) {
        console.warn(err);
      }
    }

    function presentInk() {
      const w = drawCanvas.clientWidth;
      const h = drawCanvas.clientHeight;
      drawCtx.clearRect(0, 0, w, h);
      drawCtx.drawImage(ink, 0, 0, w, h);
    }

    function sizeCanvases() {
      const stage = document.getElementById('stage');
      const w = Math.max(1, Math.floor(stage.clientWidth));
      const h = Math.max(1, Math.floor(stage.clientHeight));
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const bw = Math.floor(w * dpr);
      const bh = Math.floor(h * dpr);

      // Keep ink content when resizing
      const old = document.createElement('canvas');
      old.width = ink.width || bw;
      old.height = ink.height || bh;
      if (ink.width && ink.height) {
        old.getContext('2d').drawImage(ink, 0, 0);
      }

      ink.width = bw;
      ink.height = bh;
      inkCtx.setTransform(1, 0, 0, 1, 0, 0);
      if (old.width && old.height) {
        inkCtx.drawImage(old, 0, 0, bw, bh);
      }

      for (const canvas of [drawCanvas, uiCanvas]) {
        canvas.width = bw;
        canvas.height = bh;
        canvas.style.width = `${w}px`;
        canvas.style.height = `${h}px`;
        canvas.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      inkCtx.lineCap = 'round';
      inkCtx.lineJoin = 'round';
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';
      presentInk();
      updateHistoryButtons();
    }

    function clearInk() {
      pushHistory();
      inkCtx.clearRect(0, 0, ink.width, ink.height);
      presentInk();
      lastX = lastY = smoothX = smoothY = null;
      moveLastX = moveLastY = null;
      strokeActive = false;
    }

    function savePng() {
      const out = document.createElement('canvas');
      out.width = ink.width;
      out.height = ink.height;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#0a1218';
      ctx.fillRect(0, 0, out.width, out.height);
      ctx.drawImage(ink, 0, 0);
      const a = document.createElement('a');
      a.download = `air-drawer-${Date.now()}.png`;
      a.href = out.toDataURL('image/png');
      a.click();
      setStatus('Saved PNG', '#2fe6c0');
    }

    function setColor(hex) {
      colorPicker.value = hex;
      document.documentElement.style.setProperty('--glow', hex);
      [...swatchesEl.children].forEach((btn) => {
        btn.classList.toggle('active', btn.dataset.color === hex);
      });
    }

    PRESET_COLORS.forEach((c) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'swatch' + (c === colorPicker.value ? ' active' : '');
      btn.style.setProperty('--c', c);
      btn.dataset.color = c;
      btn.title = c;
      btn.addEventListener('click', () => setColor(c));
      swatchesEl.appendChild(btn);
    });

    colorPicker.addEventListener('input', () => setColor(colorPicker.value));
    camDim.addEventListener('input', () => {
      video.style.opacity = String(Number(camDim.value) / 100);
    });
    video.style.opacity = String(Number(camDim.value) / 100);

    clearBtn.addEventListener('click', clearInk);
    undoBtn.addEventListener('click', undo);
    redoBtn.addEventListener('click', redo);
    saveBtn.addEventListener('click', savePng);

    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if ((e.ctrlKey || e.metaKey) && key === 'z') {
        e.preventDefault();
        if (e.shiftKey) redo();
        else undo();
      } else if ((e.ctrlKey || e.metaKey) && key === 'y') {
        e.preventDefault();
        redo();
      } else if ((e.ctrlKey || e.metaKey) && key === 's') {
        e.preventDefault();
        savePng();
      }
    });

    window.addEventListener('resize', () => {
      sizeCanvases();
    });

    function isExtended(landmarks, tipIdx, pipIdx, mcpIdx) {
      const tip = landmarks[tipIdx];
      const pip = landmarks[pipIdx];
      const mcp = landmarks[mcpIdx];
      return tip.y < pip.y - 0.018 && tip.y < mcp.y - 0.028;
    }

    function rawGesture(landmarks) {
      const index = isExtended(landmarks, 8, 6, 5);
      const middle = isExtended(landmarks, 12, 10, 9);
      const ring = isExtended(landmarks, 16, 14, 13);
      const pinky = isExtended(landmarks, 20, 18, 17);
      const count = [index, middle, ring, pinky].filter(Boolean).length;

      // Open palm → erase
      if (count >= 3) return 'erase';

      // Peace / two fingers → move drawing
      if (index && middle && !ring && !pinky) return 'move';

      // Index only → draw
      if (index && !middle && !ring && !pinky) return 'draw';

      if (index && landmarks[8].y < landmarks[12].y - 0.045 && !ring && !pinky && !middle) {
        return 'draw';
      }

      return 'pause';
    }

    /** Require a few matching frames before switching modes (reduces flicker). */
    function stabilizeMode(next) {
      if (next === pendingMode) {
        pendingCount += 1;
      } else {
        pendingMode = next;
        pendingCount = 1;
      }

      if (pendingMode === stableMode) return stableMode;

      if (pendingCount >= MODE_STABLE_FRAMES) {
        // Ending a stroke → already committed; starting draw/erase/move → snapshot
        if (
          (pendingMode === 'draw' || pendingMode === 'erase' || pendingMode === 'move') &&
          stableMode !== pendingMode
        ) {
          pushHistory();
          strokeActive = true;
        }
        if (pendingMode === 'pause' || pendingMode !== 'draw') {
          lastX = lastY = null;
        }
        if (pendingMode !== 'move') {
          moveLastX = moveLastY = null;
        }
        stableMode = pendingMode;
      }
      return stableMode;
    }

    function toScreen(landmark, w, h) {
      return { x: (1 - landmark.x) * w, y: landmark.y * h };
    }

    function toInk(x, y) {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      return { x: x * dpr, y: y * dpr };
    }

    function drawHandSkeleton(landmarks, w, h, mode) {
      const color =
        mode === 'draw' ? colorPicker.value :
        mode === 'erase' ? '#ffd166' :
        mode === 'move' ? '#7dd3fc' : '#ff6b6b';

      uiCtx.lineWidth = 3;
      uiCtx.strokeStyle = color;

      for (const [a, b] of HAND_CONNECTIONS) {
        const p1 = toScreen(landmarks[a], w, h);
        const p2 = toScreen(landmarks[b], w, h);
        uiCtx.beginPath();
        uiCtx.moveTo(p1.x, p1.y);
        uiCtx.lineTo(p2.x, p2.y);
        uiCtx.stroke();
      }

      for (let i = 0; i < landmarks.length; i++) {
        const p = toScreen(landmarks[i], w, h);
        uiCtx.beginPath();
        uiCtx.arc(p.x, p.y, i === 8 || i === 12 ? 7 : 3.5, 0, Math.PI * 2);
        uiCtx.fillStyle = (i === 8 || i === 12) ? color : '#fff';
        uiCtx.fill();
      }
    }

    function paintBrush(x, y, size, color) {
      const p = toInk(x, y);
      const s = size * Math.min(window.devicePixelRatio || 1, 2);

      inkCtx.globalCompositeOperation = 'source-over';
      inkCtx.strokeStyle = color;
      inkCtx.fillStyle = color;
      inkCtx.lineWidth = s;
      inkCtx.shadowBlur = s * 0.65;
      inkCtx.shadowColor = color;

      if (lastX == null || lastY == null) {
        inkCtx.beginPath();
        inkCtx.arc(p.x, p.y, s / 2, 0, Math.PI * 2);
        inkCtx.fill();
      } else {
        const prev = toInk(lastX, lastY);
        inkCtx.beginPath();
        inkCtx.moveTo(prev.x, prev.y);
        inkCtx.lineTo(p.x, p.y);
        inkCtx.stroke();
      }

      inkCtx.shadowBlur = 0;
      lastX = x;
      lastY = y;
      presentInk();
    }

    function eraseAt(x, y, radius) {
      const p = toInk(x, y);
      const r = radius * Math.min(window.devicePixelRatio || 1, 2);
      inkCtx.save();
      inkCtx.globalCompositeOperation = 'destination-out';
      inkCtx.beginPath();
      inkCtx.arc(p.x, p.y, r, 0, Math.PI * 2);
      inkCtx.fill();
      inkCtx.restore();
      lastX = lastY = null;
      presentInk();
    }

    /** Slide the whole drawing with peace-sign drag. */
    function moveArt(x, y) {
      if (moveLastX == null || moveLastY == null) {
        moveLastX = x;
        moveLastY = y;
        return;
      }

      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const dx = (x - moveLastX) * dpr;
      const dy = (y - moveLastY) * dpr;

      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) {
        moveLastX = x;
        moveLastY = y;
        return;
      }

      const temp = document.createElement('canvas');
      temp.width = ink.width;
      temp.height = ink.height;
      temp.getContext('2d').drawImage(ink, 0, 0);

      inkCtx.clearRect(0, 0, ink.width, ink.height);
      inkCtx.drawImage(temp, dx, dy);

      moveLastX = x;
      moveLastY = y;
      presentInk();
    }

    function drawCursorRing(x, y, mode) {
      const size = Number(brushSize.value);
      if (mode === 'erase') {
        uiCtx.beginPath();
        uiCtx.arc(x, y, ERASER + size * 0.5, 0, Math.PI * 2);
        uiCtx.strokeStyle = 'rgba(255, 209, 102, 0.95)';
        uiCtx.lineWidth = 2;
        uiCtx.setLineDash([5, 4]);
        uiCtx.stroke();
        uiCtx.setLineDash([]);
      } else if (mode === 'draw') {
        uiCtx.beginPath();
        uiCtx.arc(x, y, Math.max(5, size * 0.5), 0, Math.PI * 2);
        uiCtx.fillStyle = colorPicker.value;
        uiCtx.fill();
      } else if (mode === 'move') {
        uiCtx.beginPath();
        uiCtx.arc(x, y, 16, 0, Math.PI * 2);
        uiCtx.strokeStyle = 'rgba(125, 211, 252, 0.95)';
        uiCtx.lineWidth = 3;
        uiCtx.stroke();
        uiCtx.beginPath();
        uiCtx.moveTo(x - 18, y);
        uiCtx.lineTo(x + 18, y);
        uiCtx.moveTo(x, y - 18);
        uiCtx.lineTo(x, y + 18);
        uiCtx.stroke();
      }
    }

    function processFrame(timestamp) {
      if (!running || !handLandmarker) {
        requestAnimationFrame(processFrame);
        return;
      }

      const w = uiCanvas.clientWidth;
      const h = uiCanvas.clientHeight;

      if (video.readyState >= 2 && video.currentTime !== lastVideoTime) {
        lastVideoTime = video.currentTime;

        let result;
        try {
          result = handLandmarker.detectForVideo(video, timestamp);
        } catch (err) {
          console.error(err);
          requestAnimationFrame(processFrame);
          return;
        }

        uiCtx.clearRect(0, 0, w, h);

        const hands = result.landmarks || [];
        if (!hands.length) {
          setStatus('No hand — move closer, good light, show palm', '#9ca3af');
          setMode('WAITING', '#9ca3af');
          lastX = lastY = smoothX = smoothY = null;
          moveLastX = moveLastY = null;
          pendingMode = 'pause';
          pendingCount = 0;
          stableMode = 'pause';
          strokeActive = false;
        } else {
          const landmarks = hands[0];
          const mode = stabilizeMode(rawGesture(landmarks));
          const tip = toScreen(landmarks[8], w, h);

          if (smoothX == null) {
            smoothX = tip.x;
            smoothY = tip.y;
          } else {
            smoothX += (tip.x - smoothX) * SMOOTH;
            smoothY += (tip.y - smoothY) * SMOOTH;
          }

          const x = smoothX;
          const y = smoothY;

          drawHandSkeleton(landmarks, w, h, mode);
          drawCursorRing(x, y, mode);

          if (mode === 'draw') {
            setStatus('Drawing — index finger only', colorPicker.value);
            setMode('DRAW', colorPicker.value);
            paintBrush(x, y, Number(brushSize.value), colorPicker.value);
          } else if (mode === 'erase') {
            setStatus('Erasing — open palm', '#ffd166');
            setMode('ERASE', '#ffd166');
            eraseAt(x, y, ERASER + Number(brushSize.value) * 0.5);
          } else if (mode === 'move') {
            setStatus('Moving art — drag with ✌️ peace sign', '#7dd3fc');
            setMode('MOVE', '#7dd3fc');
            moveArt(x, y);
            lastX = lastY = null;
          } else {
            setStatus('Paused — fist holds still', '#ff6b6b');
            setMode('PAUSE', '#ff6b6b');
            lastX = lastY = null;
            moveLastX = moveLastY = null;
            strokeActive = false;
          }
        }
      }

      requestAnimationFrame(processFrame);
    }

    async function createTracker() {
      setStatus('Downloading hand model...', '#fbbf24');
      gateMsg.textContent = 'Loading hand AI model (needs internet once)...';

      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'GPU'
        },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence: 0.5,
        minTrackingConfidence: 0.5
      });
    }

    async function startCamera() {
      startBtn.disabled = true;
      setStatus('Opening camera...', '#fbbf24');

      try {
        if (!handLandmarker) {
          try {
            await createTracker();
          } catch (gpuErr) {
            console.warn('GPU init failed, trying CPU', gpuErr);
            const vision = await FilesetResolver.forVisionTasks(
              'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
            );
            handLandmarker = await HandLandmarker.createFromOptions(vision, {
              baseOptions: {
                modelAssetPath:
                  'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
                delegate: 'CPU'
              },
              runningMode: 'VIDEO',
              numHands: 1
            });
          }
        }

        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Camera API not available. Use Live Server (http://localhost).');
        }

        let stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: 'user',
              width: { ideal: 1280 },
              height: { ideal: 720 }
            }
          });
        } catch (_) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        video.srcObject = stream;
        await video.play();

        sizeCanvases();
        gate.classList.add('hidden');
        running = true;
        setStatus('Camera ON — show hand (colored skeleton = tracked)', '#2fe6c0');
        setMode('READY', '#2fe6c0');
        requestAnimationFrame(processFrame);
      } catch (error) {
        console.error(error);
        startBtn.disabled = false;
        let msg = error.message || 'Could not start camera / tracker';
        if (error.name === 'NotAllowedError') {
          msg = 'Camera blocked. Allow camera in the address bar, then retry.';
        } else if (error.name === 'NotFoundError') {
          msg = 'No webcam found.';
        }
        setStatus(msg, '#ff6b6b');
        gateMsg.textContent = msg;
        gate.classList.remove('hidden');
      }
    }

    startBtn.addEventListener('click', startCamera);
    sizeCanvases();

    window.addEventListener('load', () => {
      setTimeout(startCamera, 200);
    });
  </script>
</body>
</html>
